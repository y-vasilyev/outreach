# API (Fastify) — REST + Socket.IO on :4000.
# Health probes hit the routes defined in `apps/api/src/routes/health.ts`:
#   - /health      → no-check, 200 unless process is shutting down (liveness)
#   - /health/deep → pings Postgres + Redis (readiness)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: outreach
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      terminationGracePeriodSeconds: 30
      # Apply pending Prisma migrations before the api starts serving.
      # `prisma migrate deploy` is idempotent (only runs migrations whose row
      # isn't already in `_prisma_migrations`), so this is safe on every
      # pod restart, not just rollouts. Workers don't run migrations
      # themselves — they're racy + concurrency-unsafe; this single
      # initContainer is the only writer to the schema, and workers only
      # ever read/write data via the generated client.
      initContainers:
        - name: migrate
          image: cr.yandex/__paste-cr-registry-id__/outreach-api:latest
          imagePullPolicy: Always
          command:
            - pnpm
            - --filter
            - "@nosquare/db"
            - exec
            - prisma
            - migrate
            - deploy
            - --schema=./prisma/schema.prisma
          envFrom:
            - configMapRef:
                name: outreach-config
            - secretRef:
                name: outreach-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
        # Seed admin user, default endpoints (Yandex / OpenRouter when
        # their keys are present), campaign types, agent configs and the
        # feature_flag registry. Runs AFTER `migrate` (initContainers are
        # sequential). The seed script (`packages/db/prisma/seed.ts`)
        # uses upsert + versioned-bump everywhere, so re-running it on
        # every pod restart is a no-op once the desired state is in place.
        # SEED_ADMIN_EMAIL / SEED_ADMIN_PASSWORD must be set in the Secret
        # — otherwise the script falls back to admin@nosquare.local / admin
        # which is unsafe for any reachable deployment.
        - name: seed
          image: cr.yandex/__paste-cr-registry-id__/outreach-api:latest
          imagePullPolicy: Always
          command:
            - pnpm
            - --filter
            - "@nosquare/db"
            - exec
            - tsx
            - prisma/seed.ts
          envFrom:
            - configMapRef:
                name: outreach-config
            - secretRef:
                name: outreach-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
      containers:
        - name: api
          image: cr.yandex/__paste-cr-registry-id__/outreach-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
              name: http
          envFrom:
            - configMapRef:
                name: outreach-config
            - secretRef:
                name: outreach-secrets
          resources:
            requests:
              memory: "384Mi"
              cpu: "200m"
            limits:
              memory: "768Mi"
              cpu: "1000m"
          startupProbe:
            httpGet:
              path: /health/deep
              port: 4000
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/deep
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: outreach
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 4000
      targetPort: 4000
  type: ClusterIP
