# Single-host ingress for outreach.su, split across TWO Ingress objects.
#
# Why two objects: nginx-ingress annotations are scoped to the whole Ingress
# object, not per-path. The REST route needs `rewrite-target: /$2` (+ use-regex)
# to strip the `/api` prefix, but that annotation rewrites EVERY path in the
# object. The `/socket.io` path has no `$2` capture group, so it would be
# rewritten to `/` and never reach the socket.io server — killing realtime and
# triggering an endless client reconnect loop. We therefore keep socket.io in
# its own annotation-free object (`outreach-ws`) so its path reaches the api
# untouched, and leave REST + SPA in the rewrite-bearing object (`outreach`).
#
# Routing across both objects (nginx-ingress merges rules per host):
#   /socket.io     → api:4000   (long-lived WS, path preserved, NO rewrite)
#   /api(/|$)(.*)  → api:4000   (REST; `/api` prefix stripped via rewrite-target)
#   /              → web:80     (Vue SPA static bundle)
#
# TLS: cert-manager (already installed in-cluster) issues a Let's Encrypt cert
# for outreach.su; the `ClusterIssuer` is named `letsencrypt`. Both objects
# reference the same `tls-outreach-su` secret.
---
# Socket.IO — dedicated object WITHOUT rewrite-target/use-regex so the
# `/socket.io` path is forwarded verbatim. Carries the long WS timeouts.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: outreach-ws
  namespace: outreach
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # Socket.IO uses a long-lived WS upgrade. Default nginx timeouts (60s)
    # would force a reconnect storm on every minute of idle. 1h matches the
    # socket.io-server ping interval defaults comfortably.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - outreach.su
      secretName: tls-outreach-su
  rules:
    - host: outreach.su
      http:
        paths:
          # No rewrite — the api mounts socket.io at /socket.io. Prefix match
          # is more specific than the SPA `/` catch-all, so it wins.
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 4000
---
# REST + SPA — rewrite-bearing object. The `rewrite-target: /$2` here is safe
# because every path below supplies a `$2` capture group.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: outreach
  namespace: outreach
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # Lifted from the original talkmeter bundle. Outreach has no media
    # upload path at the moment, but the admin UI does post zod-validated
    # campaign payloads that can grow with large channel/contact lists.
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # HSTS — 1 year + subdomains. `preload` left off intentionally: opting
    # into the browser preload list is irreversible and should be a
    # deliberate decision by the domain owner, not a default.
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    nginx.ingress.kubernetes.io/hsts-preload: "false"
    # Required so the regex capture in /api(/|$)(.*) below works for the
    # rewrite-target.
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - outreach.su
      secretName: tls-outreach-su
  rules:
    - host: outreach.su
      http:
        paths:
          # REST. `/api/foo` → `/foo` (rewrite-target /$2 strips the prefix).
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: api
                port:
                  number: 4000
          # SPA catch-all. The regex group `()()` ensures rewrite-target /$2
          # resolves to the original path (it would otherwise emit "/" for
          # every request if the captures were missing).
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: web
                port:
                  number: 80
