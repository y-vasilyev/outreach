server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed, content-addressed bundles. They MUST exist or 404 — never fall
  # back to index.html, or a stale tab requesting an old chunk hash would get
  # an HTML body for a `.js` import and fail with a misleading MIME error.
  # The hash in the filename makes the content immutable, so cache hard.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA fallback — application/deep-link routes (no matching file) resolve to
  # index.html so the client router can take over.
  location / {
    try_files $uri /index.html;
  }

  # Forward API and websocket to api service
  location /api/ {
    proxy_pass http://api:4000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /socket.io/ {
    proxy_pass http://api:4000/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript;
}
